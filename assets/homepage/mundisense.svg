<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"><title>MundiSense v1 architecture schematic</title><desc>Voice and face video feed an audio-visual model and two specialists. Frozen fusion and calibration produce seven expression scores or abstention. Animation is explanatory, not measured inference.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#281338"/><stop offset="1" stop-color="#48224e"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.flow{stroke-dasharray:5 9;animation:flow 2s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.6s ease-in-out infinite}.b{animation-delay:-.5s}.c{animation-delay:-1s}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes pulse{50%{opacity:.4}}@keyframes wave{50%{transform:scaleY(.4)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="560" height="420" rx="18" fill="url(#bg)"/><g fill="#dbc4e5"><text x="26" y="36" font-size="12" letter-spacing="2.5">MUNDISENSE</text><text x="532" y="36" text-anchor="end" font-size="11">v1 / H3</text></g><path d="M26 53H534" stroke="#70517e"/><g stroke="#b68bcd" stroke-width="2" fill="none"><path d="M132 126H180V195H212M132 126H212M132 262H180V195M132 262H212"/><path class="flow" d="M342 126H378V195H411M342 195H411M342 262H378V195"/></g><g fill="#3d244e" stroke="#8e68a1"><rect x="24" y="90" width="108" height="77" rx="10"/><rect x="24" y="226" width="108" height="77" rx="10"/></g><g stroke="#e0b6f2" stroke-width="3" stroke-linecap="round"><path class="wave" d="M42 120v15M52 108v37M62 116v23M72 102v48"/><path class="wave b" d="M82 111v31M92 115v23M102 106v40M112 120v15"/></g><g fill="none" stroke="#e0b6f2" stroke-width="2"><ellipse cx="78" cy="262" rx="19" ry="24"/><path d="M67 258h4m14 0h4m-18 17q7 4 14 0M47 248v-9h10m42 9v-9H89m-42 38v10h10m42-10v10H89"/></g><g fill="#dbc4e5" font-size="11" text-anchor="middle"><text x="78" y="187">VOICE</text><text x="78" y="325">FACE VIDEO</text></g><g fill="#51335f" stroke="#ae81c1"><rect x="212" y="102" width="130" height="48" rx="8"/><rect x="212" y="171" width="130" height="48" rx="8"/><rect x="212" y="238" width="130" height="48" rx="8"/></g><g text-anchor="middle" fill="#f5eafa"><text x="277" y="123" font-size="12">A3 · Audio</text><text x="277" y="139" font-size="9" fill="#c8afd4">Chinese HuBERT</text><text x="277" y="191" font-size="12">Q_AV · Audio + Video</text><text x="277" y="207" font-size="9" fill="#c8afd4">Qwen2.5-Omni + LoRA</text><text x="277" y="259" font-size="12">V2 · Vision</text><text x="277" y="275" font-size="9" fill="#c8afd4">CLIP ViT-L/14</text></g><circle class="pulse" cx="378" cy="195" r="5" fill="#eed0ff"/><rect x="411" y="151" width="124" height="88" rx="10" fill="#ecdaf5"/><g text-anchor="middle" fill="#482153"><text x="473" y="177" font-size="12" font-weight="bold">Fuse + calibrate</text><text x="473" y="198" font-size="10">7 expression scores</text><text x="473" y="219" font-size="10">or abstain</text></g><path d="M26 352H534" stroke="#70517e"/><text x="26" y="378" fill="#e0c8ec" font-size="11">Voice + expression, with room for uncertainty.</text><text x="26" y="400" fill="#b89cc6" font-size="9">SCHEMATIC · NOT A RECORDED PREDICTION</text></svg>